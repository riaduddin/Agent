version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    command: sleep infinity

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
