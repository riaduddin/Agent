services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/key.json
      - REDIS_HOST=redis
      - SSOREADY_API_KEY=your_ssoready_api_key_here
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    # No host port mapping; backend will reach Redis via service name
