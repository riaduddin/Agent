#     'set', 'image',
#     'deployment/${_DEPLOYMENT}',
#     '${_CONTAINER}=us-east1-docker.pkg.dev/gadhs-dd-uat/gadhs-dd-reg02-backend/backend-image:${SHORT_SHA}',
#     '--namespace=${_NAMESPACE}'
#   ]
 
images:
- 'us-east1-docker.pkg.dev/${_ARTIFACT_REG_NM}/gadhs-dd-reg02-backend/backend-image:${SHORT_SHA}'
 
substitutions:
  _CLUSTER_NAME:   'gadhs-dd-autopilot-cluster'
  _CLUSTER_REGION: 'us-east1'
  _NAMESPACE:      'default'
  _DEPLOYMENT:     'georgia-backend-depl'
  _CONTAINER:      'main-container'
