<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Market Share & Dominance</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>

  <!-- React, ReactDOM, Babel, Recharts -->
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Open Sans', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 1280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .slide h1 {
      font-family: 'Montserrat', sans-serif;
      color: #0A2E5D;
      font-size: 36px;
      text-align: center;
      margin-bottom: 10px;
    }

    .slide p {
      font-size: 18px;
      text-align: center;
      margin-bottom: 30px;
    }

    .charts {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chart-box {
      width: 400px;
    }

    .chart-title {
      font-size: 20px;
      text-align: center;
      margin-bottom: 10px;
      color: #0A2E5D;
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

    const { PieChart, Pie, Cell, Label } = Recharts;

    const COLORS = ['#0A2E5D', '#F0F2F5'];

    const CustomLabel = ({ viewBox, value }) => {
      const { cx, cy } = viewBox;
      return (
        <text x={cx} y={cy} fill="#0A2E5D" textAnchor="middle" dominantBaseline="central" style={{ fontSize: 30, fontWeight: 'bold' }}>
          {value}%
        </text>
      );
    };

    const Slide = () => {
      const windowsData = [
        { name: 'Windows', value: 74.14 },
        { name: 'Other', value: 25.86 },
      ];

      const officeData = [
        { name: 'Office 365', value: 45.46 },
        { name: 'Other', value: 54.54 },
      ];

      return (
        <div className="slide">
          <h1>Market Share & Dominance</h1>
          <p>Windows leads desktop OS (74.14%), and Office 365 leads productivity software (45.46%).</p>

          <div className="charts">
            <div className="chart-box">
              <div className="chart-title">Desktop OS Market</div>
              <PieChart width={400} height={300}>
                <Pie
                  data={windowsData}
                  dataKey="value"
                  nameKey="name"
                  cx="50%"
                  cy="50%"
                  innerRadius={70}
                  outerRadius={100}
                  paddingAngle={5}
                  startAngle={90}
                  endAngle={450}
                >
                  {windowsData.map((entry, index) => (
                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                  ))}
                  <Label content={<CustomLabel value={windowsData[0].value} />} position="center" />
                </Pie>
              </PieChart>
            </div>

            <div className="chart-box">
              <div className="chart-title">Office Suite Market</div>
              <PieChart width={400} height={300}>
                <Pie
                  data={officeData}
                  dataKey="value"
                  nameKey="name"
                  cx="50%"
                  cy="50%"
                  innerRadius={70}
                  outerRadius={100}
                  paddingAngle={5}
                  startAngle={90}
                  endAngle={450}
                >
                  {officeData.map((entry, index) => (
                    <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                  ))}
                  <Label content={<CustomLabel value={officeData[0].value} />} position="center" />
                </Pie>
              </PieChart>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<Slide />, document.getElementById('root'));
  </script>
</body>
</html>
