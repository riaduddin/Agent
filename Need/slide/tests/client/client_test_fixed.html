<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Client Test - Fixed</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 3px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .status { padding: 5px 10px; border-radius: 3px; margin: 5px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .warning { background: #fff3cd; color: #856404; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 3px; }
        .event-item { margin: 5px 0; padding: 8px; border-left: 3px solid #007bff; background: #f8f9fa; }
        .event-user { border-left-color: #28a745; }
        .event-agent { border-left-color: #ffc107; }
        .event-system { border-left-color: #dc3545; }
        .event-complete { border-left-color: #6f42c1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Socket.IO Client Test - Real-Time Data</h1>
        
        <div class="section">
            <h3>Configuration</h3>
            <input type="text" id="serverUrl" placeholder="Server URL" value="http://127.0.0.1:8060">
            <input type="text" id="token" placeholder="JWT Token" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2ODgwODdlMzA1MTk0OTc2YWVhOTk0MDMiLCJzdWIiOiI2ODgwODdlMzA1MTk0OTc2YWVhOTk0MDMiLCJlbWFpbCI6InJycmlhZHVkZGluQGdtYWlsLmNvbSIsInBhY2thZ2UiOiJ1bmxpbWl0ZWQiLCJpc192ZXJpZmllZCI6dHJ1ZSwicm9sZSI6InVzZXIiLCJpYXQiOjE3NjEzNzczMzAsImV4cCI6MTc2MTQ2MzczMH0.dUeYJu4jNbaSfN8jRloiFiRTie1WkJ1prWtMe-_RQLg">
            <textarea id="message" placeholder="Presentation message" rows="3">Create a presentation about AI in Healthcare</textarea>
        </div>

        <div class="section">
            <h3>Actions</h3>
            <button onclick="createPresentation()">Create Presentation</button>
            <button onclick="startPresentation()" id="startBtn" disabled>Start Presentation</button>
            <button onclick="connectSocket()" id="connectBtn">Connect Socket.IO</button>
            <button onclick="disconnectSocket()" id="disconnectBtn" disabled>Disconnect</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>

        <div class="section">
            <h3>Status</h3>
            <div id="status" class="status info">Ready</div>
            <div id="presentationId" style="margin: 10px 0;"></div>
        </div>

        <div class="section">
            <h3>Real-time Events from agent_outputs_2</h3>
            <div id="events" class="log"></div>
        </div>

        <div class="section">
            <h3>Raw Socket.IO Log</h3>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let presentationId = null;
        let eventCount = 0;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `status ${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function addEvent(data, type = 'info') {
            const eventsDiv = document.getElementById('events');
            const timestamp = new Date().toLocaleTimeString();
            eventCount++;
            
            const eventDiv = document.createElement('div');
            eventDiv.className = `event-item event-${type}`;
            
            let content = '';
            if (data.html_content) {
                content = `🎨 HTML Content: ${data.html_content.substring(0, 100)}...`;
            } else if (data.thinking) {
                content = `💭 Thinking: ${data.thinking.substring(0, 100)}...`;
            } else if (data.topic) {
                content = `🎯 Topic: ${data.topic}`;
            } else if (data.text) {
                content = `📝 Text: ${data.text.substring(0, 100)}...`;
            } else {
                content = `📄 Data: ${JSON.stringify(data).substring(0, 100)}...`;
            }
            
            eventDiv.innerHTML = `
                <strong>[${timestamp}] Event #${eventCount}</strong><br>
                <strong>Author:</strong> ${data.author || 'unknown'}<br>
                <strong>Type:</strong> ${data.type || 'unknown'}<br>
                <strong>Content:</strong> ${content}<br>
                <strong>P_ID:</strong> ${data.p_id || 'unknown'}<br>
                <strong>Event ID:</strong> ${data.event_id || 'N/A'}
            `;
            
            eventsDiv.appendChild(eventDiv);
            eventsDiv.scrollTop = eventsDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('events').innerHTML = '';
            eventCount = 0;
        }

        async function createPresentation() {
            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;
            const message = document.getElementById('message').value;

            try {
                updateStatus('Creating presentation...', 'info');
                log('Creating presentation...');

                const response = await fetch(`${serverUrl}/create-presentation`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        message: message,
                        file_urls: []
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    presentationId = data.p_id;
                    document.getElementById('presentationId').textContent = `Presentation ID: ${presentationId}`;
                    document.getElementById('startBtn').disabled = false;
                    updateStatus('Presentation created successfully!', 'success');
                    log(`Presentation created: ${presentationId}`, 'success');
                } else {
                    updateStatus('Failed to create presentation', 'error');
                    log(`Error: ${data.detail || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                updateStatus('Error creating presentation', 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function startPresentation() {
            if (!presentationId) {
                log('No presentation ID available', 'error');
                return;
            }

            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;

            try {
                updateStatus('Starting presentation...', 'info');
                log('Starting presentation...');

                const response = await fetch(`${serverUrl}/start-presentation/${presentationId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    updateStatus('Presentation started successfully!', 'success');
                    log(`Presentation started: ${data.message}`, 'success');
                } else {
                    updateStatus('Failed to start presentation', 'error');
                    log(`Error: ${data.detail || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                updateStatus('Error starting presentation', 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        function connectSocket() {
            if (!presentationId) {
                log('Please create a presentation first', 'error');
                return;
            }

            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;

            try {
                updateStatus('Connecting to Socket.IO...', 'info');
                log('Connecting to Socket.IO...');

                // Try different connection methods
                const connectionOptions = {
                    query: {
                        p_id: presentationId,
                        token: token
                    },
                    transports: ['polling', 'websocket'],
                    timeout: 20000,
                    forceNew: true
                };

                socket = io(serverUrl, connectionOptions);

                socket.on('connect', () => {
                    updateStatus('Connected to Socket.IO!', 'success');
                    log('Connected to Socket.IO', 'success');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                });

                socket.on('disconnect', (reason) => {
                    updateStatus('Disconnected from Socket.IO', 'error');
                    log(`Disconnected from Socket.IO: ${reason}`, 'error');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                });

                socket.on('agent_output', (data) => {
                    log(`Agent Output: ${JSON.stringify(data, null, 2)}`, 'info');
                    addEvent(data, 'agent');
                });

                socket.on('message', (data) => {
                    log(`Message: ${JSON.stringify(data, null, 2)}`, 'info');
                    addEvent(data, 'system');
                });

                socket.on('connect_error', (error) => {
                    updateStatus('Socket.IO connection failed', 'error');
                    log(`Connection error: ${error.message}`, 'error');
                    log(`Error details: ${JSON.stringify(error)}`, 'error');
                });

                socket.on('error', (error) => {
                    log(`Socket.IO error: ${error}`, 'error');
                });

                // Listen for all events
                socket.onAny((eventName, data) => {
                    log(`Received event: ${eventName}`, 'info');
                    if (eventName === 'agent_output') {
                        addEvent(data, 'agent');
                    } else if (eventName === 'message') {
                        addEvent(data, 'system');
                    }
                });

            } catch (error) {
                updateStatus('Error connecting to Socket.IO', 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        function disconnectSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                updateStatus('Disconnected from Socket.IO', 'info');
                log('Disconnected from Socket.IO', 'info');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }

        // Auto-refresh status every 5 seconds
        setInterval(async () => {
            if (presentationId) {
                try {
                    const serverUrl = document.getElementById('serverUrl').value;
                    const token = document.getElementById('token').value;
                    
                    const response = await fetch(`${serverUrl}/presentation/${presentationId}/status`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`Status: ${data.status} | Title: ${data.title} | Slides: ${data.total_slides}`, 'info');
                    }
                } catch (error) {
                    // Silent fail for auto-refresh
                }
            }
        }, 5000);
    </script>
</body>
</html>
